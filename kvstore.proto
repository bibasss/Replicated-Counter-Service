syntax = "proto3";

package kvstore;

// ---------------------------------------------------------------------------
// Client-facing API (exactly as specified in Lab 6-7, Task 1)
// ---------------------------------------------------------------------------

enum ReadConsistency {
  LINEARIZABLE = 0;    // Must hit Leaseholder / Quorum
  FOLLOWER_STALE = 1;  // Served by local replica; bounded staleness
}

enum WriteStrategy {
  QUORUM_CP = 0;  // Requires majority (N/2 + 1) ACKs; fails if quorum lost
  ALWAYS_AP = 1;  // Accepts write on any available node; logs vector clock / timestamp
}

message GetRequest {
  string key = 1;
  ReadConsistency consistency = 2;
  uint32 max_staleness_ms = 3;  // Used when consistency == FOLLOWER_STALE (0 = no bound)
}

message GetReply {
  string value = 1;
  bool found = 2;
  uint64 read_timestamp = 3;    // microseconds; the timestamp the read is consistent at
  bool is_stale = 4;            // true when served by a follower from local state
}

message PutRequest {
  string key = 1;
  string value = 2;
  string idempotency_key = 3;
  WriteStrategy strategy = 4;
  uint64 timestamp = 5;         // LWW version in microseconds (0 = assigned by the server)
}

message PutReply {
  bool success = 1;
  uint32 acks_received = 2;
  string error_message = 3;
}

service KeyValueStore {
  rpc Get (GetRequest) returns (GetReply);
  rpc Put (PutRequest) returns (PutReply);
}

// ---------------------------------------------------------------------------
// Replica-to-replica API (not part of the lab spec; used internally and by the
// quorum-arithmetic experiment in tests/test_cap.py)
// ---------------------------------------------------------------------------

// One versioned value. Versions are ordered by (timestamp, origin): the
// larger timestamp wins, the origin node name breaks ties (Last-Write-Wins).
message Entry {
  string key = 1;
  string value = 2;
  uint64 timestamp = 3;
  string origin = 4;            // node that accepted the write
}

message ReplicateReply {
  bool applied = 1;             // false when the replica already had a newer version
}

// Leaseholder -> follower, every --heartbeat-ms. Carries the writes that
// could not be delivered earlier and the closed timestamp: the follower has
// every committed CP write with timestamp <= closed_timestamp.
message HeartbeatRequest {
  string leaseholder = 1;
  uint64 closed_timestamp = 2;
  repeated Entry entries = 3;
}
message HeartbeatReply {
  string node = 1;
}

// Anti-entropy: each side sends its whole state and merges the other's by LWW.
message SyncRequest {
  string node = 1;
  repeated Entry entries = 2;
}
message SyncReply {
  string node = 1;
  repeated Entry entries = 2;
}

message ReadLocalRequest {
  string key = 1;
}
message ReadLocalReply {
  bool found = 1;
  Entry entry = 2;
}

service ReplicaPeer {
  rpc Replicate (Entry) returns (ReplicateReply);          // apply one version locally
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
  rpc Sync (SyncRequest) returns (SyncReply);
  rpc ReadLocal (ReadLocalRequest) returns (ReadLocalReply); // local state, no forwarding
}
